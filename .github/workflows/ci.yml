name: BiblioNet CI Pipeline

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:

  build-and-test:
    name: Build i testovi
    runs-on: ubuntu-latest

    steps:
      - name: Checkout koda
        uses: actions/checkout@v4

      - name: Podesavanje Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build i testovi - discovery-server
        working-directory: ./discovery-server
        run: ./mvnw clean package

      - name: Build i testovi - api-gateway
        working-directory: ./api-gateway
        run: ./mvnw clean package

      - name: Build i testovi - member-service
        working-directory: ./member-service
        run: ./mvnw clean package

      - name: Build i testovi - book-service
        working-directory: ./book-service
        run: ./mvnw clean package

      - name: Build i testovi - loan-service
        working-directory: ./loan-service
        run: ./mvnw clean package

      - name: Build i testovi - notification-service
        working-directory: ./notification-service
        run: ./mvnw clean package

      - name: Build i testovi - reservation-service
        working-directory: ./reservation-service
        run: ./mvnw clean package

  docker-build:
    name: Docker slike
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout koda
        uses: actions/checkout@v4

      - name: Podesavanje Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # Dockerfile-ovi kopiraju gotov jar iz target/, pa se moduli prvo pakuju.
      # Testovi se preskacu jer su vec prosli u prethodnom job-u.
      - name: Pakovanje svih modula
        run: |
          for module in discovery-server api-gateway member-service book-service \
                        loan-service notification-service reservation-service; do
            echo "::group::Pakovanje $module"
            (cd "$module" && ./mvnw -B clean package -DskipTests)
            echo "::endgroup::"
          done

      - name: Provera da su svi jar fajlovi napravljeni
        run: |
          for module in discovery-server api-gateway member-service book-service \
                        loan-service notification-service reservation-service; do
            jar="$module/target/$module-0.0.1-SNAPSHOT.jar"
            test -f "$jar" || { echo "Nedostaje $jar"; exit 1; }
            echo "OK $jar"
          done

      - name: Build Docker slika
        run: docker compose build

      - name: Spisak izgradjenih slika
        run: docker images --filter "reference=*biblioteka*" --format "{{.Repository}}\t{{.Size}}"
