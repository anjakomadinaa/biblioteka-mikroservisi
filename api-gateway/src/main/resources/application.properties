server.port=8080

spring.application.name=api-gateway

eureka.client.service-url.defaultZone=${EUREKA_URI:http://localhost:8761/eureka/}

spring.cloud.gateway.mvc.routes[0].id=member-service
spring.cloud.gateway.mvc.routes[0].uri=lb://MEMBER-SERVICE
spring.cloud.gateway.mvc.routes[0].predicates[0]=Path=/api/members/**
spring.cloud.gateway.mvc.routes[0].filters[0]=StripPrefix=1

spring.cloud.gateway.mvc.routes[1].id=book-service
spring.cloud.gateway.mvc.routes[1].uri=lb://BOOK-SERVICE
spring.cloud.gateway.mvc.routes[1].predicates[0]=Path=/api/books/**
spring.cloud.gateway.mvc.routes[1].filters[0]=StripPrefix=1

spring.cloud.gateway.mvc.routes[2].id=loan-service
spring.cloud.gateway.mvc.routes[2].uri=lb://LOAN-SERVICE
spring.cloud.gateway.mvc.routes[2].predicates[0]=Path=/api/loans/**
spring.cloud.gateway.mvc.routes[2].filters[0]=StripPrefix=1

spring.cloud.gateway.mvc.routes[3].id=notification-service
spring.cloud.gateway.mvc.routes[3].uri=lb://NOTIFICATION-SERVICE
spring.cloud.gateway.mvc.routes[3].predicates[0]=Path=/api/notifications/**
spring.cloud.gateway.mvc.routes[3].filters[0]=StripPrefix=1

spring.cloud.gateway.mvc.routes[4].id=reservation-service
spring.cloud.gateway.mvc.routes[4].uri=lb://RESERVATION-SERVICE
spring.cloud.gateway.mvc.routes[4].predicates[0]=Path=/api/reservations/**
spring.cloud.gateway.mvc.routes[4].filters[0]=StripPrefix=1
